# React Doctor — full-project drift scan.
#
# Runs the FULL React Doctor scan once per react-doctor VERSION, not on a cron:
# the scan fires whenever package.json / pnpm-lock.yaml changes on master, and
# an actions/cache entry keyed by the resolved react-doctor version makes each
# version run exactly once. Exactly-once semantics come entirely from that
# cache key:
#   - Dependency bumps that don't touch react-doctor re-resolve to the same
#     version, hit the cache, and skip both the marking step and the scan —
#     costing only this no-op run.
#   - A failed scan is never cached: actions/cache only saves on job success,
#     so a crashed scan retries on the next trigger instead of being recorded
#     as "seen".
# This is the master-branch counterpart of the PR gate (react-doctor.yml): it
# surfaces whole-repo debt trends without gating anything.
name: React Doctor (drift scan)

on:
  push:
    branches: [master]
    paths: ["**/package.json", "**/pnpm-lock.yaml"]
  workflow_dispatch:

permissions:
  contents: read
  statuses: write # the scan posts a commit status — the trend marker on master

concurrency:
  group: react-doctor-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-scan:
    # Push-only workflow: forks cannot push to master, so the other quality
    # jobs' pull_request fork check is meaningless here. USE_SELF_HOSTED_RUNNERS
    # opts in to self-hosted.
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Resolved react-doctor version for the cache key AND the Action's
      # version input below, so the scan runs the exact CLI the cache key (and
      # the local hk gates) track. Read from pnpm-lock.yaml: there is no
      # dependency install in this workflow, so node_modules resolution would
      # always fail on runners, and package.json may hold a Renovate range —
      # the lockfile carries the exact resolved version instead. (The
      # [[:space:]] anchor matches this repo's pnpm-lock v9 keys, which have
      # no leading slash, and keeps sibling packages like
      # oxlint-plugin-react-doctor from matching.)
      - id: rdver
        run: |
          v="$(grep -m1 -oE '[[:space:]]react-doctor@[0-9]+\.[0-9]+\.[0-9]+' pnpm-lock.yaml | cut -d@ -f2-)"
          if [ -z "$v" ]; then echo "::error::react-doctor version not found in pnpm-lock.yaml"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Cache-as-marker: a hit means this react-doctor version already had its
      # full scan. Only saved if the job succeeds (see header).
      - id: seen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .rd-drift
          key: rd-drift-${{ steps.rdver.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ vars.USE_SELF_HOSTED_RUNNERS == 'true' && 'self-hosted-macos-arm64' || 'hosted-ubuntu-latest' }}

      - name: Mark this version as scanned
        if: steps.seen.outputs.cache-hit != 'true'
        run: mkdir -p .rd-drift && date > ".rd-drift/${{ steps.rdver.outputs.version }}"

      # Immutable SHA pin to the current v2 release (millionco/react-doctor
      # v2.2.8); Renovate keeps the digest current via helpers:pinGitHubActionDigests.
      - name: React Doctor (full drift scan)
        if: steps.seen.outputs.cache-hit != 'true'
        uses: millionco/react-doctor@01820bb4fd4d0a4aebcd8df2b2a143a098649cb2 # v2.2.8
        with:
          directory: apps/web
          # Deterministic CLI: the workspace-pinned version from the rdver
          # step — the same string the cache key tracks.
          version: ${{ steps.rdver.outputs.version }}
          scope: full
          blocking: warning
          # The commit status is the trend marker on the default branch; drift
          # runs never leave PR feedback (there is no PR), so the comment
          # surfaces are explicitly off rather than left at their defaults.
          commit-status: true
          comment: false
          review-comments: false
