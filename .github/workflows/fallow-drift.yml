# Fallow — full-project drift scan.
#
# Runs the FULL covered Fallow scan once per fallow VERSION, not on a cron: the
# scan fires whenever package.json / pnpm-lock.yaml changes on master, and an
# actions/cache entry keyed by the resolved fallow version makes each version
# run exactly once. Exactly-once semantics come entirely from that cache key:
#   - Dependency bumps that don't touch fallow re-resolve to the same version,
#     hit the cache, and skip both the marking step and the scan — costing
#     only this no-op run.
#   - A failed scan is never cached: actions/cache only saves on job success,
#     so a crashed scan retries on the next trigger instead of being recorded
#     as "seen".
#
# The scan command is the exact pipeline every other surface runs
# (`pnpm test:coverage && pnpm fallow:ci`), so the drift verdict is identical
# to the gates' by construction. A zero-install variant was tried first and
# rejected on evidence: without node_modules, fallow warns its results are
# inaccurate, type-aware analysis degrades to partial, and both an unused-
# dependency false positive (`graphql`) and two estimated-CRAP findings appear
# that real coverage clears — so a bare-mode scan would have gone red at merge
# while every covered gate stayed green. Paying for install + coverage here is
# what makes per-version comparisons meaningful.
#
# This is the master-branch counterpart of the PR gate (fallow.yml): it
# surfaces whole-repo debt introduced by a tool upgrade, fully blocking.
name: Fallow (drift scan)

on:
  push:
    branches: [master]
    paths: ["**/package.json", "**/pnpm-lock.yaml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fallow-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-scan:
    # Push-only workflow: forks cannot push to master, so the other quality
    # jobs' pull_request fork check is meaningless here. USE_SELF_HOSTED_RUNNERS
    # opts in to self-hosted.
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Resolved fallow version for the cache key. Read from pnpm-lock.yaml
      # before any install: package.json may hold a Renovate range, while the
      # lockfile carries the exact resolved version this scan will run (the
      # frozen-lockfile install below pins node_modules to it). The
      # [[:space:]] anchor matches this repo's pnpm-lock v9 keys, which have
      # no leading slash, and keeps sibling packages like @fallow-cli/* from
      # matching.
      - id: fver
        run: |
          v="$(grep -m1 -oE '[[:space:]]fallow@[0-9]+\.[0-9]+\.[0-9]+' pnpm-lock.yaml | cut -d@ -f2-)"
          if [ -z "$v" ]; then echo "::error::fallow version not found in pnpm-lock.yaml"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # Cache-as-marker: a hit means this fallow version already had its full
      # scan. Only saved if the job succeeds (see header).
      - id: seen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fallow-drift
          key: fallow-drift-${{ steps.fver.outputs.version }}

      - name: Mark this version as scanned
        if: steps.seen.outputs.cache-hit != 'true'
        run: mkdir -p .fallow-drift && date > ".fallow-drift/${{ steps.fver.outputs.version }}"

      # Node + pinned pnpm + frozen-lockfile install — the same provisioning
      # every covered surface runs. Gated on the cache miss so no-op runs
      # stay no-ops; without it the job reaches the scan with no pnpm on PATH
      # (ubuntu-latest ships none, and the image's default Node misses this
      # repo's engines pin).
      - uses: ./.github/actions/setup-toolchain
        if: steps.seen.outputs.cache-hit != 'true'

      # Same covered pipeline as pre-push, hk check, and the CI gate — the
      # frozen-lockfile install resolves fallow to exactly the version in the
      # cache key above, so "once per version" runs that version's CLI.
      - name: Coverage + full scan
        if: steps.seen.outputs.cache-hit != 'true'
        run: pnpm test:coverage && pnpm fallow:ci
