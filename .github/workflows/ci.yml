name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PAYLOAD_SECRET: ci-payload-secret-for-github-actions
  PREVIEW_SECRET: ci-preview-secret-for-github-actions
  NEXT_PUBLIC_SERVER_URL: http://localhost:3000

jobs:
  quality:
    name: Lint, format, typecheck, fallow, unit tests
    # USE_SELF_HOSTED_RUNNERS repo variable (Settings → Actions → Variables)
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNERS == 'true' && (vars.SELF_HOSTED_RUNNER_LABELS != '' && fromJSON(vars.SELF_HOSTED_RUNNER_LABELS) || fromJSON('["self-hosted"]')) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run check:lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Fallow baseline
        run: pnpm fallow:baseline:check

      - name: Fallow audit
        run: pnpm fallow:audit

      - name: Unit tests
        run: pnpm test:unit

  build-and-integration:
    name: Build, integration, and E2E tests
    # USE_SELF_HOSTED_RUNNERS repo variable (Settings → Actions → Variables)
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNERS == 'true' && (vars.SELF_HOSTED_RUNNER_LABELS != '' && fromJSON(vars.SELF_HOSTED_RUNNER_LABELS) || fromJSON('["self-hosted"]')) || 'ubuntu-latest' }}

    env:
      POSTGRES_URL: postgres://postgres:postgres@localhost:5433/mbqb
      TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5433/mbqb_test
      CI: true

    steps:
      - uses: actions/checkout@v6.0.3

      - uses: ./.github/actions/setup-toolchain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start PostgreSQL
        run: |
          docker run -d \
            --name postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=mbqb \
            -p 5433:5432 \
            imresamu/postgis:17-3.5

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U postgres -d mbqb && break
            sleep 1
          done

      - name: Create integration test database
        run: docker exec postgres psql -U postgres -d mbqb -c "CREATE DATABASE mbqb_test;"

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Integration tests
        run: pnpm test:int

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        working-directory: apps/web
        run: pnpm test:e2e
