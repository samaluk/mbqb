name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PAYLOAD_SECRET: ci-payload-secret-for-github-actions
  PREVIEW_SECRET: ci-preview-secret-for-github-actions

jobs:
  quality:
    name: Lint, format, typecheck, fallow, unit tests
    # USE_SELF_HOSTED_RUNNERS repo variable (Settings → Actions → Variables)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON('["self-hosted","docker"]') || 'ubuntu-latest') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      - name: Lint
        run: pnpm run check:lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Unit tests with Istanbul coverage: the coverage evidence feeds fallow's
      # CRAP scoring. Must run before the fallow gate so the health baseline
      # comparison and baseline-freshness check see identical coverage input.
      - name: Unit tests (with coverage)
        run: pnpm test:unit:coverage

      # Authoritative ratchet: identity baselines, changed-code audit, the
      # verifier-filtered security gate (fallow-baselines/security-verdicts.json),
      # regression counts, and baseline freshness — all in `pnpm fallow:ci`.
      - name: Fallow
        run: pnpm fallow:ci

  fallow-pr:
    name: Fallow PR feedback (annotations, review, SARIF)
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON('["self-hosted","docker"]') || 'ubuntu-latest') }}
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      checks: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      # The official Action runs the same changed-code audit as `pnpm fallow:audit`
      # (version resolved from the pinned package.json dependency) but renders it as
      # PR feedback: a sticky summary comment, inline review comments, and SARIF for
      # Code Scanning. The deterministic ratchet stays in the `quality` job.
      - name: Fallow changed-code audit
        uses: fallow-rs/fallow@v3
        with:
          command: audit
          gate: new-only
          format: sarif
          sarif: true
          comment: true
          review-comments: true
          type-aware: auto
          type-aware-require: complete

  build-and-integration:
    name: Build, integration, and E2E tests
    # USE_SELF_HOSTED_RUNNERS repo variable (Settings → Actions → Variables)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest') }}

    env:
      POSTGRES_URL: postgres://postgres:postgres@localhost:5433/mbqb
      TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5433/mbqb_test
      CI: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - name: Allocate app port
        shell: bash
        run: |
          APP_PORT="$(python3 -c 'import socket; s=socket.socket(); s.bind(("", 0)); print(s.getsockname()[1]); s.close()')"
          echo "APP_PORT=$APP_PORT" >> "$GITHUB_ENV"
          echo "PORT=$APP_PORT" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SERVER_URL=http://127.0.0.1:$APP_PORT" >> "$GITHUB_ENV"

      - name: Start PostgreSQL
        run: |
          docker rm -f postgres 2>/dev/null || true
          docker run -d \
            --name postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=mbqb \
            -p 5433:5432 \
            imresamu/postgis:17-3.5

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U postgres -d mbqb >/dev/null 2>&1 || { sleep 1; continue; }
            # pg_isready succeeds against the entrypoint's temporary postmaster
            # (used for first-boot initdb.d setup); only proceed once init is
            # truly complete or CREATE DATABASE gets killed by its fast shutdown.
            docker logs postgres 2>&1 | grep -q "PostgreSQL init process complete; ready for start up" && break
            sleep 1
          done

      - name: Create integration test database
        run: docker exec postgres psql -U postgres -d mbqb -c "CREATE DATABASE mbqb_test;"

      - name: Migrate and seed E2E fixtures
        working-directory: apps/web
        run: pnpm migrate && pnpm exec tsx scripts/seed-e2e-fixtures.ts
        env:
          NODE_ENV: production

      - name: Build (local/CI target)
        working-directory: apps/web
        run: pnpm build:next
        env:
          NODE_ENV: production
          # Instant-navigation e2e verdicts need the testing API in the
          # production build. Never set in real production (see apps/web/instant-nav.rig.md).
          EXPOSE_TESTING_API: 1

      - name: Integration tests
        run: pnpm test:int

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        working-directory: apps/web
        run: pnpm test:e2e
        env:
          # Opt-in fixture seeding (see apps/web/instant-nav.rig.md): the
          # global setup only seeds when this is set, keeping the seed from
          # running as a side effect of every local test run.
          E2E_SEED_FIXTURES: 1
