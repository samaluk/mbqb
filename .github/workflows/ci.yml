name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PAYLOAD_SECRET: ci-payload-secret-for-github-actions
  PREVIEW_SECRET: ci-preview-secret-for-github-actions

jobs:
  # Static quality checks and tests run as parallel jobs so a pull request goes
  # green as fast as possible. Each job is its own required status check (the
  # master-branch ruleset lists these exact names), so every one must pass for a
  # merge. The two Fallow passes reuse the test job's coverage artifact instead
  # of reinstalling and re-running the suite a second time.
  static:
    name: Lint, typecheck & format
    # USE_SELF_HOSTED_RUNNERS repo variable (Settings → Actions → Variables)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest') }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      - name: Lint
        run: pnpm run check:lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test with coverage
    # USE_SELF_HOSTED_RUNNERS repo variable (Settings → Actions → Variables)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest') }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      # Generates coverage/coverage-final.json; both Fallow jobs consume it, so
      # tests must run before they start.
      - name: Test with coverage
        run: pnpm test:coverage

      # Shared with the two Fallow jobs below so they do not reinstall and
      # re-run the suite just to score the same evidence.
      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  gate:
    name: Fallow gate
    needs: test
    # USE_SELF_HOSTED_RUNNERS repo variable (Settings → Actions → Variables)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest') }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      # Same coverage evidence the test job produced, so audit CRAP scoring
      # matches — downloaded rather than regenerated to avoid a second
      # install + test run.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage

      # Authoritative strict Fallow migration gate (dead-code, dupes, health,
      # private-type leaks) for the diff. Mirrors `pnpm fallow:ci`; the review
      # job below owns the PR feedback surface.
      - name: Fallow CI gate
        run: pnpm fallow:ci
        env:
          FALLOW_AUDIT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'origin/master' }}

  review:
    name: Fallow PR review
    if: github.event_name == 'pull_request'
    needs: test
    # USE_SELF_HOSTED_RUNNERS repo variable (Settings → Actions → Variables)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest') }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      # The Fallow Action installs its CLI globally with npm and locates the
      # install by parsing `npm root -g` output. Two quirks of these homerun
      # runners break that: npm 11 redacts UUID-shaped segments in every
      # command's stdout (@npmcli/redact rewrites them to a literal '***'),
      # and the runner directories embed a UUID (.../runners/<uuid>/...), so
      # any prefix under the runner home makes the Action verify against a
      # mangled path and fail with platform-package-missing even though the
      # install succeeded. Newer npm also refuses `npm config get prefix`
      # outright ("The prefix option is protected"), so a plain bin-dir expose
      # is a silent no-op. Provision a prefix free of UUID-shaped segments
      # instead: prefer the shared tool cache, falling back to mktemp while
      # RUNNER_TOOL_CACHE itself still lives under a runner directory (the
      # same workaround samaluk/splitty ran until its runners were moved to a
      # UUID-free tool cache).
      - name: Provision isolated Fallow npm prefix
        run: |
          fallow_prefix="${RUNNER_TOOL_CACHE:-${RUNNER_TEMP}}/fallow-global-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          if printf '%s' "$fallow_prefix" | grep -qE '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'; then
            fallow_prefix="$(mktemp -d)/fallow-global-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          fi
          mkdir -p "$fallow_prefix"
          echo "NPM_CONFIG_PREFIX=$fallow_prefix" >> "$GITHUB_ENV"
          echo "$fallow_prefix/bin" >> "$GITHUB_PATH"
          case "${RUNNER_OS}:${RUNNER_ARCH}" in
            macOS:ARM64) fallow_platform="@fallow-cli/darwin-arm64" ;;
            Linux:X64) fallow_platform="@fallow-cli/linux-x64-gnu" ;;
            *)
              echo "Unsupported Fallow runner: ${RUNNER_OS}:${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac
          NPM_CONFIG_PREFIX="$fallow_prefix" npm install --global --ignore-scripts \
            "fallow@3.17.0" "${fallow_platform}@3.17.0"

      # Same coverage evidence the test job produced, so audit CRAP scoring
      # matches — downloaded rather than regenerated to avoid a second
      # install + test run.
      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage

      - name: Fallow changed-code audit
        uses: fallow-rs/fallow@ecf5a314fd3e10974acb4f5a7f867c433030522d # v3.17.0
        with:
          version: 3.17.0
          command: audit
          gate: new-only
          type-aware: true
          coverage: coverage/coverage-final.json
          coverage-root: ${{ github.workspace }}
          comment: true
          comment-layout: compact
          branded-token: false
          review-comments: true
          review-guidance: true
          sarif: false

  build-and-integration:
    name: Build, integration, and E2E tests
    # USE_SELF_HOSTED_RUNNERS repo variable (Settings → Actions → Variables)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest') }}

    env:
      POSTGRES_URL: postgres://postgres:postgres@localhost:5433/mbqb
      TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5433/mbqb_test
      CI: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - name: Allocate app port
        shell: bash
        run: |
          APP_PORT="$(python3 -c 'import socket; s=socket.socket(); s.bind(("", 0)); print(s.getsockname()[1]); s.close()')"
          {
            echo "APP_PORT=$APP_PORT"
            echo "PORT=$APP_PORT"
            echo "NEXT_PUBLIC_SERVER_URL=http://127.0.0.1:$APP_PORT"
          } >> "$GITHUB_ENV"

      - name: Start PostgreSQL
        run: |
          docker rm -f postgres 2>/dev/null || true
          docker run -d \
            --name postgres \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=mbqb \
            -p 5433:5432 \
            imresamu/postgis:17-3.5

      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 30); do
            docker exec postgres pg_isready -U postgres -d mbqb >/dev/null 2>&1 || { sleep 1; continue; }
            # pg_isready succeeds against the entrypoint's temporary postmaster
            # (used for first-boot initdb.d setup); only proceed once init is
            # truly complete or CREATE DATABASE gets killed by its fast shutdown.
            docker logs postgres 2>&1 | grep -q "PostgreSQL init process complete; ready for start up" && break
            sleep 1
          done

      - name: Create integration test database
        run: docker exec postgres psql -U postgres -d mbqb -c "CREATE DATABASE mbqb_test;"

      - name: Migrate and seed E2E fixtures
        working-directory: apps/web
        run: pnpm migrate && pnpm exec tsx scripts/seed-e2e-fixtures.ts
        env:
          NODE_ENV: production

      - name: Build (local/CI target)
        working-directory: apps/web
        run: pnpm build:next
        env:
          NODE_ENV: production
          # Instant-navigation e2e verdicts need the testing API in the
          # production build. Never set in real production (see apps/web/instant-nav.rig.md).
          EXPOSE_TESTING_API: 1

      - name: Integration tests
        run: pnpm test:int

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        working-directory: apps/web
        run: pnpm test:e2e
        env:
          # Opt-in fixture seeding (see apps/web/instant-nav.rig.md): the
          # global setup only seeds when this is set, keeping the seed from
          # running as a side effect of every local test run.
          E2E_SEED_FIXTURES: 1
