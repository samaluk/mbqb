packages:
  - apps/*

minimumReleaseAge: 3

# Allow immediate install of fresh Next.js releases (pnpm 11 enforces minimumReleaseAge by default).
minimumReleaseAgeExclude:
  - "@next/*"
  - next
  - react
  - react-dom
  - react-is
  - react-server-dom-*
  - nanoid
  - undici

peerDependencyRules:
  allowedVersions:
    esbuild: 0.25.12

allowBuilds:
  esbuild: true
  msw: false
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
